AWSTemplateFormatVersion: '2010-09-09'
Description: Stack for creating S3 Bucket and permissions

Parameters:
  BucketName:
    Description: Name of the S3 Bucket
    Type: String
  CloudfrontCanonicalId:
    Description: Canonical IDs for Cloudfront Distributions
    Type: CommaDelimitedList
    Default: None

Conditions:
  CloudFrontDefined: !Not
    - !Equals
      - !Select
        - 0
        - !Ref 'CloudfrontCanonicalId'
      - None

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref 'BucketName'
      LifecycleConfiguration:
        Rules:
          - Id: BranchBuildRule
            Prefix: /act/test/monorepo/branch=
            Status: Enabled
            ExpirationInDays: 30
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CloudFrontDefined
    Properties:
      Bucket: !Ref 'Bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ' Grant a CloudFront Origin Identity access to support private content'
            Effect: Allow
            Principal:
              CanonicalUser: !Ref 'CloudfrontCanonicalId'
            Action: s3:GetObject
            Resource: !Join
              - ''
              - - !GetAtt 'Bucket.Arn'
                - /*
